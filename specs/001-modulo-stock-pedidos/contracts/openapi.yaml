openapi: 3.0.3
info:
  title: Stock.Api — Módulo de Stock y generación automática de pedidos
  version: 1.0.0
  description: |
    API REST del módulo de stock. Ver `README.md` para convenciones de autenticación,
    autorización y mapeo de códigos de estado.
    Toda regla de negocio vive detrás de esta API; `Stock.Web` es sólo un consumidor.

servers:
  - url: http://localhost:5279
    description: Desarrollo local vía docker compose

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Perfiles
  - name: Usuarios
  - name: Articulos
  - name: Movimientos
  - name: Consultas

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión y obtener un token (RF-011)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Credenciales válidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: |
            Usuario inexistente o contraseña incorrecta. El mensaje es idéntico en
            ambos casos ("Usuario o contraseña incorrectos") para no revelar si la
            cuenta existe. (RF-011)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/perfiles:
    get:
      tags: [Perfiles]
      summary: Listar perfiles de seguridad (sólo administrador, RF-010a)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Perfil' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403': { $ref: '#/components/responses/PerfilInsuficiente' }
    post:
      tags: [Perfiles]
      summary: Alta de perfil (RF-001, sólo administrador por RF-010a)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PerfilRequest' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Perfil' }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403': { $ref: '#/components/responses/PerfilInsuficiente' }

  /api/perfiles/{perfilId}:
    parameters:
      - name: perfilId
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Perfiles]
      summary: Modificar la descripción de un perfil (RF-003)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PerfilRequest' }
      responses:
        '204': { description: Modificado }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403': { $ref: '#/components/responses/PerfilInsuficiente' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    delete:
      tags: [Perfiles]
      summary: Baja de perfil (RF-002)
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403': { $ref: '#/components/responses/PerfilInsuficiente' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: |
            Baja restringida. Dos causas posibles: el perfil tiene usuarios
            asignados (RF-002a), o es el perfil administrador, que no puede
            eliminarse aunque no tenga usuarios (RF-002b).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/usuarios:
    get:
      tags: [Usuarios]
      summary: Listar usuarios (sólo administrador, RF-010)
      responses:
        '200':
          description: OK. Nunca incluye Hash ni Salt.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403': { $ref: '#/components/responses/PerfilInsuficiente' }
    post:
      tags: [Usuarios]
      summary: Alta de usuario (RF-004, sólo administrador)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuarioRequest' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400':
          description: Contraseña que incumple la política de RF-009, u otro dato inválido. (RF-009)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403': { $ref: '#/components/responses/PerfilInsuficiente' }
        '409':
          description: Nombre de usuario ya existente.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/usuarios/{usuarioId}:
    parameters:
      - name: usuarioId
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Usuarios]
      summary: Modificar usuario (RF-006). Contraseña opcional; si se omite, no se re-deriva el hash.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuarioRequest' }
      responses:
        '204': { description: Modificado }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403': { $ref: '#/components/responses/PerfilInsuficiente' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: |
            El usuario es el último con perfil administrador y el cambio le
            quitaría ese perfil; el sistema no puede quedar sin administrador. (RF-005a)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
    delete:
      tags: [Usuarios]
      summary: Baja de usuario (RF-005)
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403': { $ref: '#/components/responses/PerfilInsuficiente' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: |
            El usuario es el último con perfil administrador; baja restringida
            para que el sistema no quede sin administrador. (RF-005a)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/articulos:
    get:
      tags: [Articulos]
      summary: Listar artículos, con filtro opcional por descripción
      parameters:
        - name: descripcion
          in: query
          schema: { type: string }
          description: Coincidencia parcial, insensible a mayúsculas y acentos. (RF-027a)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Articulo' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
    post:
      tags: [Articulos]
      summary: Alta de artículo (RF-013)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArticuloRequest' }
      responses:
        '201':
          description: Creado. `precioVenta` viene calculado por el sistema. (RF-016)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Articulo' }
        '400':
          description: |
            Valor negativo, parámetro de reposición no entero, o incumplimiento de
            StockMinimo ≤ PuntoPedido ≤ StockIdeal. (RF-018, RF-019)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '409':
          description: Código de artículo duplicado. (RF-017)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/articulos/{articuloId}:
    parameters:
      - name: articuloId
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Articulos]
      summary: Modificar artículo (RF-015)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArticuloRequest' }
      responses:
        '204': { description: Modificado }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: Código duplicado. (RF-017)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
    delete:
      tags: [Articulos]
      summary: Baja de artículo (RF-014)
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: El artículo tiene movimientos asociados; baja restringida. (RF-014a)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/movimientos:
    get:
      tags: [Movimientos]
      summary: Listar movimientos
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Movimiento' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
    post:
      tags: [Movimientos]
      summary: Alta de movimiento (RF-020). Todo-o-nada. (RF-024c)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovimientoRequest' }
      responses:
        '201':
          description: |
            Creado. `numero` lo asigna el sistema desde una secuencia global única
            compartida entre compras y ventas. (RF-020a)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movimiento' }
        '400':
          description: |
            Cantidad no entera (rechazada al deserializar, RF-018a); cantidad ≤ 0
            o > 1.000.000; Precio Unitario negativo o fuera de tope; fecha futura;
            tipo inválido. (RF-018a, RF-020b, RF-020d, RF-023, RF-023a, RF-023c)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '422': { $ref: '#/components/responses/StockInsuficiente' }

  /api/movimientos/{numero}:
    parameters:
      - name: numero
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Movimientos]
      summary: Modificar movimiento (RF-022). Todo-o-nada. (RF-024c)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovimientoRequest' }
      responses:
        '204': { description: Modificado }
        '400': { $ref: '#/components/responses/ValidacionInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/StockInsuficiente' }
    delete:
      tags: [Movimientos]
      summary: Baja de movimiento, encabezado y detalle (RF-021)
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422':
          description: |
            La baja dejaría el Stock Actual de algún artículo por debajo de 0 —
            típicamente una compra ya consumida por ventas posteriores. (RF-024a)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/consultas/stock-actual:
    get:
      tags: [Consultas]
      summary: Consulta de Stock Actual (RF-025)
      parameters:
        - name: codigoDesde
          in: query
          schema: { type: string }
          description: Extremo inferior inclusive del rango. Vacío = sin límite inferior. (RF-025a)
        - name: codigoHasta
          in: query
          schema: { type: string }
          description: Extremo superior inclusive del rango. Vacío = sin límite superior. (RF-025a)
        - name: descripcion
          in: query
          schema: { type: string }
          description: Filtro opcional, coincidencia parcial insensible a mayúsculas y acentos. (RF-027a)
      responses:
        '200':
          description: |
            Ordenado por Código ascendente, recortado a 10.000 filas tras filtrar y
            ordenar. Incluye artículos sin movimientos con cantidad 0. (RF-027b, RF-030)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoStockActual' }
        '401': { $ref: '#/components/responses/NoAutorizado' }

  /api/consultas/stock-actual/excel:
    get:
      tags: [Consultas]
      summary: Exportar la Consulta de Stock Actual a Excel (RF-031)
      parameters:
        - { name: codigoDesde,  in: query, schema: { type: string } }
        - { name: codigoHasta,  in: query, schema: { type: string } }
        - { name: descripcion,  in: query, schema: { type: string } }
      responses:
        '200':
          description: |
            Archivo .xlsx con exactamente las mismas filas, orden y recorte que la
            respuesta JSON con los mismos parámetros. Resultado vacío ⇒ sólo encabezados. (RF-031)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/NoAutorizado' }

  /api/consultas/generar-pedido:
    get:
      tags: [Consultas]
      summary: Generar Pedido (RF-026)
      parameters:
        - name: soloBajoMinimo
          in: query
          required: true
          schema: { type: boolean }
          description: Parámetro de reposición. Sí ⇒ sólo artículos con Stock Actual < Stock Mínimo.
        - name: modoPedido
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ModoPedido' }
          description: Parámetro de reposición. Determina el Nivel objetivo.
        - name: descripcion
          in: query
          schema: { type: string }
          description: |
            Filtro de acotación opcional, no es un parámetro de reposición: su omisión
            no altera el cálculo. No existe parámetro de rango acá. (CE-001, RF-026a)
      responses:
        '200':
          description: Ordenado por Código ascendente, recortado a 10.000 filas. (RF-027b)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoGenerarPedido' }
        '400':
          description: |
            Falta un parámetro de reposición o `modoPedido` no es un valor admitido.
            Ambos son obligatorios y sin valor por defecto. (RF-026b)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '401': { $ref: '#/components/responses/NoAutorizado' }

  /api/consultas/generar-pedido/excel:
    get:
      tags: [Consultas]
      summary: Exportar Generar Pedido a Excel (RF-031)
      parameters:
        - { name: soloBajoMinimo, in: query, required: true, schema: { type: boolean } }
        - { name: modoPedido,     in: query, required: true, schema: { $ref: '#/components/schemas/ModoPedido' } }
        - { name: descripcion,    in: query, schema: { type: string } }
      responses:
        '200':
          description: Archivo .xlsx que replica filas, orden y recorte de la pantalla. (RF-031)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/NoAutorizado' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    NoAutorizado:
      description: Sin sesión autenticada válida. (RF-012)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    PerfilInsuficiente:
      description: Autenticado, pero el perfil no es administrador. (RF-010)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NoEncontrado:
      description: El recurso no existe.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    ValidacionInvalida:
      description: Entrada que viola una regla de validación de campo.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    StockInsuficiente:
      description: |
        La operación dejaría el Stock Actual de algún artículo por debajo de 0.
        Es también la respuesta ante concurrencia perdida, evaluada contra el saldo
        ya actualizado: nunca se devuelve un error de reintento. (RF-024, RF-024b)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

  schemas:
    ProblemDetails:
      type: object
      description: RFC 7807. `detail` es apto para mostrar al usuario; nunca expone detalle interno.
      properties:
        type:   { type: string }
        title:  { type: string }
        status: { type: integer }
        detail: { type: string, example: 'Stock insuficiente para el artículo A-001.' }

    LoginRequest:
      type: object
      required: [usuario, password]
      properties:
        usuario:  { type: string }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      properties:
        token:     { type: string, description: JWT HS256, vigencia 8 horas. }
        expiraEn:  { type: string, format: date-time }
        perfil:    { type: string, example: administrador }

    Perfil:
      type: object
      properties:
        perfilId:    { type: integer }
        descripcion: { type: string }
        esAdministrador:
          type: boolean
          readOnly: true
          description: |
            Marca inmutable que identifica al perfil administrador. Se establece
            en la siembra inicial y es la única base de las decisiones de
            autorización; la descripción es un rótulo editable sin efecto sobre
            los privilegios. (RF-003a)

    PerfilRequest:
      type: object
      required: [descripcion]
      additionalProperties: false
      description: |
        No admite esAdministrador: la marca no es alcanzable desde la API. Un
        cuerpo que la incluya se rechaza por additionalProperties. (RF-003a)
      properties:
        descripcion: { type: string, maxLength: 100 }

    Usuario:
      type: object
      description: Nunca incluye Hash ni Salt. (RF-007)
      properties:
        usuarioId:      { type: integer }
        nombreUsuario:  { type: string }
        nombreCompleto: { type: string }
        perfilId:       { type: integer }

    UsuarioRequest:
      type: object
      required: [nombreUsuario, nombreCompleto, perfilId]
      properties:
        nombreUsuario:  { type: string, maxLength: 50 }
        nombreCompleto: { type: string, maxLength: 200 }
        perfilId:       { type: integer }
        password:
          type: string
          format: password
          description: |
            Mínimo 8 caracteres, con al menos una letra y un dígito; los símbolos
            están permitidos. Obligatorio en el alta; en la
            modificación, si se omite se conserva el hash existente. (RF-009)

    Articulo:
      type: object
      properties:
        articuloId:   { type: integer }
        codigo:       { type: string }
        descripcion:  { type: string }
        precioCosto:  { type: number, format: double }
        margen:       { type: number, format: double, description: Porcentaje. }
        precioVenta:  { type: number, format: double, readOnly: true, description: 'Calculado: costo × (1 + margen/100). (RF-016)' }
        stockMinimo:  { type: integer }
        puntoPedido:  { type: integer }
        stockIdeal:   { type: integer }

    ArticuloRequest:
      type: object
      required: [codigo, descripcion, precioCosto, margen, stockMinimo, puntoPedido, stockIdeal]
      properties:
        codigo:       { type: string, maxLength: 50 }
        descripcion:  { type: string, maxLength: 200 }
        precioCosto:  { type: number, format: double, minimum: 0 }
        margen:       { type: number, format: double, minimum: 0 }
        stockMinimo:  { type: integer, minimum: 0, description: Entero no negativo. (RF-013a) }
        puntoPedido:  { type: integer, minimum: 0 }
        stockIdeal:   { type: integer, minimum: 0 }

    TipoMovimiento:
      type: string
      enum: [Compra, Venta]
      description: Conjunto cerrado. Compra suma al stock, Venta resta. (RF-020b)

    Movimiento:
      type: object
      properties:
        numero: { type: integer, readOnly: true, description: Asignado por el sistema. (RF-020a) }
        tipo:   { $ref: '#/components/schemas/TipoMovimiento' }
        fecha:  { type: string, format: date }
        detalle:
          type: array
          items: { $ref: '#/components/schemas/MovimientoDetalle' }

    MovimientoDetalle:
      type: object
      properties:
        articuloId:     { type: integer }
        codigo:         { type: string, readOnly: true }
        cantidad:       { type: integer, minimum: 1, maximum: 1000000 }
        precioUnitario: { type: number, format: double, minimum: 0 }
        precioTotal:    { type: number, format: double, readOnly: true, description: 'Calculado: cantidad × precio unitario. (RF-020c)' }

    MovimientoRequest:
      type: object
      required: [tipo, fecha, detalle]
      properties:
        tipo:   { $ref: '#/components/schemas/TipoMovimiento' }
        fecha:  { type: string, format: date, description: No puede ser posterior a hoy. (RF-020d) }
        detalle:
          type: array
          minItems: 1
          items:
            type: object
            required: [articuloId, cantidad, precioUnitario]
            properties:
              articuloId:     { type: integer }
              cantidad:       { type: integer, minimum: 1, maximum: 1000000 }
              precioUnitario: { type: number, format: double, minimum: 0 }

    ModoPedido:
      type: string
      enum: [HastaStockMinimo, HastaPuntoPedido, HastaStockIdeal]

    FilaStockActual:
      type: object
      properties:
        codigo:      { type: string }
        descripcion: { type: string }
        cantidad:    { type: integer, description: Stock Actual, saldo de movimientos. Nunca negativo. }

    ResultadoStockActual:
      type: object
      properties:
        filas:
          type: array
          items: { $ref: '#/components/schemas/FilaStockActual' }
        truncado:
          type: boolean
          description: true si se alcanzó el tope de 10.000 filas; la UI debe informarlo. (RF-027c)

    FilaGenerarPedido:
      type: object
      properties:
        codigo:          { type: string }
        descripcion:     { type: string }
        cantidadAPedir:  { type: integer, minimum: 0, description: 'MAX(0, Nivel − Stock Actual). Nunca negativa. (CE-003)' }

    ResultadoGenerarPedido:
      type: object
      properties:
        filas:
          type: array
          items: { $ref: '#/components/schemas/FilaGenerarPedido' }
        truncado:
          type: boolean
          description: true si se alcanzó el tope de 10.000 filas. (RF-027c)
